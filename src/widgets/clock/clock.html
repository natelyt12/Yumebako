<div class="widget clock-widget" id="widget-clock"
    style="position: absolute; left: 10px; top: 10px; width: max-content; min-width: unset; height: auto;">
    <div class="clock-simple-container">
        <div class="clock-row">
            <span class="clock-time" id="clock-widget-time"><span class="clock-hour"
                    id="clock-widget-hour">00</span><span class="clock-colon">:</span><span class="clock-minute"
                    id="clock-widget-minute">00</span></span>
            <span class="clock-ampm" id="clock-widget-ampm" style="display:none"></span>
        </div>
        <div class="clock-seconds-progress" id="clock-widget-seconds-container" style="display:none">
            <div class="clock-seconds-fill" id="clock-widget-seconds-fill"></div>
        </div>
    </div>
</div>

<div class="widget clock-widget" id="widget-date"
    style="position: absolute; left: 10px; top: 180px; width: max-content; min-width: unset; height: auto;">
    <div class="clock-date-group">
        <div class="clock-date" id="clock-widget-date">Wednesday, 1/1/2025</div>
    </div>
</div>

<div class="widget clock-widget" id="widget-lunar"
    style="position: absolute; left: 10px; top: 220px; width: max-content; min-width: unset; height: auto;">
    <div class="clock-date-group">
        <div class="clock-lunar" id="clock-widget-lunar">Âm lịch: Đang tải...</div>
    </div>
</div>
