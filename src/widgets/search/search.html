<div class="widget search-widget" id="widget-search">
  <div class="search-box" id="search-box" tabindex="0">
    <div class="search-provider-slot" id="search-provider-slot">
      <span class="search-icon-layer search-icon-default">
        <i data-icon="search"></i>
      </span>
      <span class="search-icon-layer search-icon-provider">
        <span class="search-provider-glyph" id="search-icon-provider"></span>
        <span class="search-provider-arrows">
          <span class="search-arrow search-arrow-up" id="search-arrow-up">
            <i data-icon="caretUpSmall"></i>
          </span>
          <span class="search-arrow search-arrow-down" id="search-arrow-down">
            <i data-icon="caretDownSmall"></i>
          </span>
        </span>
      </span>
    </div>
    <div class="search-provider-reel" id="search-provider-reel">
      <div class="search-provider-track" id="search-provider-track"></div>
    </div>
    <canvas class="search-box__canvas" id="search-canvas"></canvas>
    <input
      class="search-box__proxy"
      id="search-proxy"
      type="text"
      autocomplete="off"
      spellcheck="false"
    />
  </div>
  <div class="search-autocomplete" id="search-autocomplete" role="listbox"></div>
</div>
