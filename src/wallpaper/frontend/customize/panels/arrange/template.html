<div class="setting_section wallpaper_editor">
    <p class="setting_title" data-i18n="bg_editor.window_title">
        Điều chỉnh vị trí
    </p>
    <div id="editor_container" class="editor_container">
        <div id="full_image_view" class="full_image_view">
            <div id="view_lens" class="view_lens">
                <div class="lens_corner" data-corner="nw"></div>
                <div class="lens_corner" data-corner="ne"></div>
                <div class="lens_corner" data-corner="sw"></div>
                <div class="lens_corner" data-corner="se"></div>
            </div>
        </div>
    </div>
    <div class="editor_row">
        <label class="btn" data-action="toggle">
            <span data-i18n="bg_editor.fit_mode_label">Hiển thị toàn bộ ảnh</span>
            <input type="checkbox" id="fit_mode_checkbox" />
        </label>
    </div>
    <div class="editor_controls flex_col gap_8" id="manual_controls"></div>
    <div class="section_divider"></div>
    <div class="flex_row gap_8 w_full">
        <button id="btn_reset" class="btn flex_1" data-i18n="bg_editor.btn_reset">
            Đặt lại
        </button>
        <button id="btn_apply" class="btn flex_1" data-i18n="bg_editor.btn_apply">
            Lưu
        </button>
    </div>
    <span class="tooltip" data-i18n="bg_editor.note_tooltip">
        Lưu ý: Zoom tại đây và Zoom trong Wavy Animation không liên quan đến nhau
    </span>
</div>
