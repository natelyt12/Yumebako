<div class="wallpaper_switcher_inner">
  <div class="wallpaper_switcher_top_bar">
    <div class="wallpaper_switcher_top_left">
      <div
        class="wallpaper_source_tabs_wrapper"
        id="wallpaper_source_tabs_wrapper"
      >
        <div class="wallpaper_source_tabs" id="wallpaper_source_tabs"></div>
      </div>
      <span
        class="wallpaper_switcher_counter"
        id="wallpaper_switcher_counter"
      ></span>
      <div
        class="wallpaper_switcher_loader is-hidden"
        id="wallpaper_switcher_loader"
        aria-hidden="true"
      >
        <svg viewBox="25 25 50 50">
          <circle r="20" cy="50" cx="50"></circle>
        </svg>
      </div>
    </div>
    <div class="wallpaper_switcher_top_right">
      <div
        class="wallpaper_switcher_meta_wrapper"
        id="wallpaper_switcher_meta_wrapper"
      >
        <div
          class="wallpaper_switcher_meta_sizer"
          id="wallpaper_switcher_meta_sizer"
          aria-hidden="true"
        ></div>
        <div
          class="wallpaper_switcher_meta_card"
          id="wallpaper_switcher_meta_card"
        >
          <div
            class="wallpaper_switcher_meta_header"
            id="wallpaper_switcher_meta_header"
          ></div>
          <div
            class="wallpaper_switcher_meta_body"
            id="wallpaper_switcher_meta_body"
          ></div>
        </div>
      </div>
      <button
        type="button"
        class="wallpaper_switcher_icon_btn"
        id="wallpaper_switcher_settings_btn"
      >
        <i data-icon="settings"></i>
      </button>
      <button
        type="button"
        class="wallpaper_switcher_icon_btn"
        id="wallpaper_switcher_close_btn"
        data-i18n-title="sp.sb.close"
        title="Đóng"
      >
        <i data-icon="close"></i>
      </button>
    </div>
  </div>
  <div class="carousel-container hide-accent-bg" id="wallpaper_carousel">
    <div class="carousel-guide"></div>
    <div class="carousel-viewfinder"></div>
    <div
      class="carousel-track hide-accent-bg"
      id="wallpaper_carousel_track"
    ></div>
    <div class="carousel-empty-state" id="wallpaper_carousel_empty">
      <i data-icon="image"></i>
      <span class="empty-title" data-i18n="wallpaper_switcher.empty_title"
        >Chưa có hình nền nào</span
      >
      <span class="empty-sub" data-i18n="wallpaper_switcher.empty_hint"
        >Kéo thả ảnh vào đây hoặc bấm nút Tải lên</span
      >
    </div>
  </div>
  <div class="wallpaper_switcher_bar">
    <div class="wallpaper_switcher_spacer"></div>
    <div
      class="wallpaper_source_actions hidden is-hidden"
      id="wallpaper_switcher_actions"
    ></div>
    <div class="wallpaper_switcher_controls" id="wallpaper_switcher_controls">
      <button
        type="button"
        class="btn wallpaper_fetch_btn hidden"
        id="wallpaper_fetch_btn"
        data-i18n-title="wallpaper_switcher.get_new_image"
        title="Lấy ảnh mới"
      >
        <i data-icon="arrowClockwise"></i>
        <span data-i18n="wallpaper_switcher.get_new_image">Lấy ảnh mới</span>
      </button>
      <button
        type="button"
        class="btn wallpaper_upload_btn hidden"
        id="wallpaper_upload_btn"
        data-i18n-title="sp.api.collection.upload_btn"
        title="Tải lên ảnh / video"
      >
        <i data-icon="upload"></i>
        <span data-i18n="sp.api.collection.upload_btn"
          >Tải lên ảnh / video</span
        >
      </button>
      <button
        type="button"
        class="btn wallpaper_source_settings hidden"
        id="wallpaper_source_settings"
      >
        <i data-icon="settings"></i>
        <span>Cài đặt nguồn</span>
      </button>
    </div>
  </div>
  <!-- Transparent click-catcher: only closes the drawer on outside clicks. No background, no blur. -->
  <div
    class="wallpaper_switcher_sidebar_overlay"
    id="wallpaper_switcher_sidebar_overlay"
    aria-hidden="true"
  ></div>
  <aside
    class="wallpaper_switcher_sidebar"
    id="wallpaper_switcher_sidebar"
    aria-hidden="true"
    inert
  >
    <div class="wallpaper_switcher_sidebar_header">
      <span
        class="wallpaper_switcher_sidebar_title"
        id="wallpaper_switcher_sidebar_title"
      ></span>
      <button
        type="button"
        class="wallpaper_switcher_sidebar_close"
        id="wallpaper_switcher_sidebar_close_btn"
        data-i18n-title="sp.sb.close"
        title="Đóng"
      >
        <i data-icon="close"></i>
      </button>
    </div>
    <div
      class="wallpaper_switcher_sidebar_body"
      id="wallpaper_switcher_sidebar_body"
    ></div>
    <div
      class="wallpaper_switcher_sidebar_footer"
      id="wallpaper_switcher_sidebar_footer"
      hidden
    ></div>
  </aside>
</div>
