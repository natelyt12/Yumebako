<!-- Feature Templates -->
<template id="tpl_wallpaper_editor">
    <div class="setting_section wallpaper_editor">
        <div id="editor_container" class="editor_container">
            <div id="full_image_view" class="full_image_view">
                <div id="view_lens" class="view_lens">
                    <div class="lens_corner" data-corner="nw"></div>
                    <div class="lens_corner" data-corner="ne"></div>
                    <div class="lens_corner" data-corner="sw"></div>
                    <div class="lens_corner" data-corner="se"></div>
                </div>
            </div>
        </div>
        <div class="editor_row">
            <label class="checkbox btn_liked">
                <span data-i18n="bg_editor.fit_mode_label">Hiển thị toàn bộ ảnh</span>
                <input type="checkbox" id="fit_mode_checkbox" />
                <div class="ts-track">
                    <div class="ts-thumb"></div>
                </div>
            </label>
        </div>
        <div class="editor_controls flex_col gap_8" id="manual_controls">
            <!-- Dynamic sliders injected here -->
        </div>
        <div class="section_divider"></div>
        <div class="flex_row gap_8 w_full">
            <button id="btn_reset" class="secondary flex_1" data-i18n="bg_editor.btn_reset">Đặt lại</button>
            <button id="btn_apply" class="primary flex_1" data-i18n="bg_editor.btn_apply">Lưu</button>
        </div>
        <span class="tooltip" data-i18n="bg_editor.note_tooltip">Lưu ý: Zoom tại đây và Zoom trong Wavy Animation không
            liên quan đến nhau</span>
    </div>
</template>

<template id="bg_collection_popup_tpl">
    <div class="bg_collection_popup">
        <!-- Header actions -->
        <div class="bg_collection_header">
            <button id="coll_upload_btn" class="icon_button">
                <i data-icon="upload"></i>
                <span data-i18n="sp.api.collection.upload_btn">Tải lên ảnh / video</span>
            </button>
            <input type="file" id="coll_file_input" multiple accept="image/*,video/*" style="display: none" />
            <button id="coll_bulk_delete_btn" class="icon_button primary danger_btn" style="display: none">
                <i data-icon="bulkDelete"></i>
                <span data-i18n="sp.api.collection.delete_selected">Xóa mục đã chọn</span>
            </button>
            <button id="coll_select_mode_btn" class="icon_button secondary">
                <i data-icon="selectMode"></i>
                <span data-i18n="sp.api.collection.select_mode">Chọn nhiều</span>
            </button>
        </div>
        <!-- Empty state -->
        <div id="coll_empty_state" class="bg_coll_empty">
            <i data-icon="emptyCollection"></i>
            <p>Bộ sưu tập trống</p>
            <span>Tải lên ảnh/video hoặc thêm hình nền đang hiển thị</span>
        </div>
        <!-- Grid -->
        <div id="coll_grid" class="bg_collection_grid" style="display: none"></div>
    </div>
</template>

<template id="tpl_wavy_settings">
    <!-- Section 1: Wavy Animation -->
    <div class="setting_section wavy_settings">
        <div class="section_divider" data-i18n="wavy.motion_type_label">Kiểu chuyển động</div>
        <div class="dropdown_wrapper" id="wavy_motion_wrapper">
            <button class="dropdown_button" id="wavy_motion_type">
                <span class="selected_value">--</span>
                <div class="sbsctsvg"></div>
            </button>
            <!-- Items injected from the motion registry -->
            <div class="dropdown" id="wavy_motion_dropdown"></div>
        </div>
        <label class="checkbox btn_liked">
            <span data-i18n="wavy.advanced_settings">Cài đặt nâng cao</span>
            <input type="checkbox" id="wavy_advanced_toggle" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>

        <!-- Advanced: parameters of the selected motion type, rebuilt on mode change -->
        <div id="wavy_advanced_section" class="flex_col gap_8 w_full">
            <div class="section_divider" data-i18n="wavy.advanced_settings">Cài đặt nâng cao</div>
            <span class="tooltip" data-i18n="wavy.motion_tooltip">Mỗi kiểu chuyển động có bộ thông số riêng ở bên
                dưới. Riêng tỉ lệ Phóng to là dùng chung cho tất cả các kiểu. Lưu ý: tăng Tốc độ hoặc Độ xoay quá cao có
                thể gây mỏi mắt hoặc chóng mặt.</span>
            <div id="wavy_motion_sliders" class="flex_col gap_8 w_full"></div>

            <div class="section_divider"></div>

            <!-- Only randomises the style parameters above, so it lives inside
                 the advanced section and hides together with it. -->
            <button id="btn_wavy_random" class="secondary w_full" data-i18n="wavy.btn_random">Ngẫu nhiên</button>
        </div>

        <div class="section_divider" data-i18n="wavy.shared_section_label">Tùy chỉnh chung</div>

        <!-- Shared by every motion type and always visible -->
        <div id="wavy_shared_sliders" class="flex_col gap_8 w_full"></div>

        <div class="section_divider"></div>

        <div class="flex_row gap_8 w_full">
            <button id="btn_wavy_reset" class="secondary flex_1" data-i18n="wavy.btn_default">Mặc định</button>
            <button id="btn_wavy_save" class="primary flex_1" data-i18n="wavy.btn_save">Lưu</button>
        </div>
        <span class="tooltip" data-i18n="wavy.note_tooltip">
            Cài đặt mặc định mang lại hiệu ứng tự nhiên nhất.
        </span>
    </div>
</template>

<template id="tpl_parallax_settings">
    <!-- Section 2: Parallax Effect -->
    <div class="setting_section parallax_settings">
        <div id="parallax_sliders_container" class="flex_col gap_8 w_full">
            <!-- Dynamic parallax sliders injected here -->
        </div>
        <div class="section_divider"></div>

        <div class="flex_row gap_8 w_full">
            <button id="btn_parallax_reset" class="secondary flex_1" data-i18n="wavy.btn_default">Mặc định</button>
            <button id="btn_parallax_save" class="primary flex_1" data-i18n="wavy.btn_save">Lưu</button>
        </div>
        <span class="tooltip" data-i18n="wavy.parallax_tooltip">
            Biên độ âm di chuyển ngược hướng con trỏ chuột, biên độ dương di chuyển cùng hướng. Độ nặng càng nhỏ thì di
            chuyển càng đầm trễ.
            Lưu ý: Chỉnh biên độ bám chuột quá cao có thể khiến hình nền bị lộ viền, hãy kết hợp tăng nhẹ tỉ lệ Phóng to
            để khắc phục.
        </span>
    </div>
</template>

<template id="tpl_onload_settings">
    <div class="setting_section onload_settings">
        <p class="popup_section_title" data-i18n="onload_anim.preset_label">Hiệu ứng có sẵn</p>
        <div class="dropdown_wrapper">
            <button class="dropdown_button" id="onload_preset">
                <span class="selected_value">--</span>
                <div class="sbsctsvg"></div>
            </button>
            <!-- Preset items are built from the registry (see OnloadEditorUI). -->
            <div class="dropdown" id="onload_preset_dropdown"></div>
        </div>

        <label class="checkbox btn_liked">
            <span data-i18n="onload_anim.advanced_settings">Cài đặt nâng cao</span>
            <input type="checkbox" id="onload_advanced_toggle" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>

        <div id="onload_advanced_section" class="flex_col gap_8 w_full">
            <div class="section_divider" data-i18n="onload_anim.custom_bg_label">Tùy chỉnh hình nền</div>
            <div class="custom_onload_animation flex_col gap_12" id="onload_bg_sliders"></div>

            <p class="popup_section_title" data-i18n="onload_anim.bg_easing_label">Easing hình nền</p>
            <div class="dropdown_wrapper">
                <button class="dropdown_button" id="onload_bg_easing">
                    <span class="selected_value">--</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="dropdown" id="onload_bg_easing_dropdown"></div>
            </div>

            <div class="section_divider" data-i18n="onload_anim.custom_overlay_label">Tùy chỉnh lớp phủ</div>
            <div class="custom_onload_animation flex_col gap_12" id="onload_overlay_sliders"></div>
        </div>

        <div class="section_divider" data-i18n="onload_anim.other_settings_label">Cài đặt khác</div>
        <label class="checkbox btn_liked">
            <span data-i18n="onload_anim.widget_immediate">Giao diện xuất hiện ngay lập tức</span>
            <input type="checkbox" id="widget_immediate" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>
        <span class="tooltip" data-i18n="onload_anim.widget_immediate_tooltip">Nếu tắt, giao diện sẽ đợi hoạt ảnh mở
            trang chạy xong mới hiển thị.</span>
        <div class="flex_row gap_8 w_full">
            <button id="btn_preview" class="secondary flex_1" data-i18n="onload_anim.btn_preview">Xem trước</button>
            <button id="btn_save" class="primary flex_1" data-i18n="onload_anim.btn_save">Lưu</button>
        </div>
    </div>
</template>

<template id="tpl_filter_settings">
    <div class="setting_section">
        <div id="filter_sliders_container" class="flex_col gap_12 w_full">
            <!-- Dynamic sliders injected here -->
        </div>
        <div class="section_divider"></div>
        <div class="actions">
            <button id="btn_filter_reset" class="secondary" data-i18n="bg_editor.btn_reset">Đặt lại</button>
            <button id="btn_filter_save" class="primary" data-i18n="wavy.btn_save">Lưu</button>
        </div>
    </div>
</template>

<template id="tpl_particles_settings">
    <div class="setting_section particles_editor">
        <div id="particles_columns" class="effects_columns">
            <!-- Dynamic and Static columns rendered dynamically -->
        </div>
        <span class="tooltip" data-i18n="particles.editor_tooltip">Lưu ý: Hiệu ứng càng nhiều sẽ đòi hỏi hiệu năng GPU
            càng cao.</span>
        <div class="flex_row gap_8 w_full">
            <button id="btn_clear_all" class="secondary flex_1" data-i18n="particles.btn_clear_all">Xóa tất
                cả</button>
            <button id="btn_save" class="primary flex_1" data-i18n="particles.btn_save">Lưu</button>
        </div>
    </div>
</template>

<!-- Provider Extra Settings Submenu Templates -->
<template id="tpl_wallhaven_settings">
    <div class="setting_section">
        <p class="setting_title" data-i18n="sp.api.wallhaven.search">Tìm kiếm</p>
        <div class="setting_options flex_col gap_8">
            <div class="input_container">
                <input type="text" id="wh_query" class="sub_input"
                    placeholder="Từ khóa tìm kiếm (Ví dụ: Nature, Cyberpunk)" autocomplete="off" />
            </div>
            <span class="tooltip" data-i18n="sp.api.wallhaven.search_tooltip">Cú pháp tìm kiếm (vd: anime, landscape,
                -girl,
                type:png...). Bỏ trống để lấy ảnh ngẫu nhiên.</span>
        </div>
    </div>
    <div class="setting_section">
        <p class="setting_title" data-i18n="sp.api.wallhaven.categories">Thể loại</p>
        <div class="setting_options flex_col gap_8">
            <label class="checkbox btn_liked">
                <span data-i18n="sp.api.wallhaven.cat_general">General</span>
                <input type="checkbox" id="wh_cat_general" />
                <div class="ts-track">
                    <div class="ts-thumb"></div>
                </div>
            </label>
            <label class="checkbox btn_liked">
                <span data-i18n="sp.api.wallhaven.cat_anime">Anime</span>
                <input type="checkbox" id="wh_cat_anime" />
                <div class="ts-track">
                    <div class="ts-thumb"></div>
                </div>
            </label>
            <label class="checkbox btn_liked">
                <span data-i18n="sp.api.wallhaven.cat_people">People</span>
                <input type="checkbox" id="wh_cat_people" />
                <div class="ts-track">
                    <div class="ts-thumb"></div>
                </div>
            </label>
            <span class="tooltip" data-i18n="sp.api.wallhaven.category.tooltip">Lựa chọn các nhãn phân loại ảnh bạn muốn
                hiển thị.</span>
        </div>
    </div>
    <div class="setting_section">
        <p class="setting_title" data-i18n="sp.api.wallhaven.resolution">Độ phân giải tối thiểu</p>
        <div class="setting_options flex_col gap_8">
            <div class="dropdown_wrapper">
                <button class="dropdown_button" id="wh_resolution">
                    <span class="selected_value">1920x1080</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="dropdown">
                    <div class="dropdown_item btn_liked" data-value="any" data-i18n="sp.api.wallhaven.resolution_any">
                        Tất cả</div>
                    <div class="dropdown_item btn_liked" data-value="1920x1080">Full HD (1920x1080)</div>
                    <div class="dropdown_item btn_liked" data-value="2560x1440">2K (2560x1440)</div>
                    <div class="dropdown_item btn_liked" data-value="3840x2160">4K (3840x2160)</div>
                </div>
            </div>
            <span class="tooltip" data-i18n="sp.api.wallhaven.resolution_tooltip">Chỉ tìm kiếm hình ảnh đạt hoặc vượt độ
                phân giải được chọn.</span>
        </div>
    </div>
    <div class="setting_section">
        <p class="setting_title" data-i18n="sp.api.wallhaven.sorting">Sắp xếp theo</p>
        <div class="setting_options flex_col gap_8">
            <div class="dropdown_wrapper">
                <button class="dropdown_button" id="wh_sorting">
                    <span class="selected_value" data-i18n="sp.api.wallhaven.sort_random">Ngẫu nhiên</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="dropdown">
                    <div class="dropdown_item btn_liked" data-value="random" data-i18n="sp.api.wallhaven.sort_random">
                        Ngẫu nhiên</div>
                    <div class="dropdown_item btn_liked" data-value="date_added" data-i18n="sp.api.wallhaven.sort_date">
                        Mới nhất</div>
                    <div class="dropdown_item btn_liked" data-value="views" data-i18n="sp.api.wallhaven.sort_views">Lượt
                        xem</div>
                    <div class="dropdown_item btn_liked" data-value="favorites"
                        data-i18n="sp.api.wallhaven.sort_favorites">Yêu thích</div>
                    <div class="dropdown_item btn_liked" data-value="toplist" data-i18n="sp.api.wallhaven.sort_toplist">
                        Toplist</div>
                </div>
            </div>
            <div class="dropdown_wrapper" id="wh_toprange_wrapper" style="display: none;">
                <button class="dropdown_button" id="wh_topRange">
                    <span class="selected_value" data-i18n="sp.api.wallhaven.toprange_1M">1 Tháng</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="dropdown">
                    <div class="dropdown_item btn_liked" data-value="1d" data-i18n="sp.api.wallhaven.toprange_1d">1 Ngày
                    </div>
                    <div class="dropdown_item btn_liked" data-value="3d" data-i18n="sp.api.wallhaven.toprange_3d">3 Ngày
                    </div>
                    <div class="dropdown_item btn_liked" data-value="1w" data-i18n="sp.api.wallhaven.toprange_1w">1 Tuần
                    </div>
                    <div class="dropdown_item btn_liked" data-value="1M" data-i18n="sp.api.wallhaven.toprange_1M">1
                        Tháng</div>
                    <div class="dropdown_item btn_liked" data-value="3M" data-i18n="sp.api.wallhaven.toprange_3M">3
                        Tháng</div>
                    <div class="dropdown_item btn_liked" data-value="6M" data-i18n="sp.api.wallhaven.toprange_6M">6
                        Tháng</div>
                    <div class="dropdown_item btn_liked" data-value="1y" data-i18n="sp.api.wallhaven.toprange_1y">1 Năm
                    </div>
                </div>
            </div>
            <span class="tooltip" data-i18n="sp.api.wallhaven.sorting_tooltip">Phương thức sắp xếp kết quả tìm
                kiếm.</span>
        </div>
    </div>
</template>


<template id="tpl_collection_settings">
    <div class="setting_section flex_col gap_8">
        <p class="setting_title" data-i18n="sp.api.collection.title">Quản lý Bộ sưu tập</p>
        <button id="open_collection_btn_submenu" class="primary w_full">
            <i data-icon="collection"></i>
            <span data-i18n="sp.api.collection.open_btn">Mở trình quản lý bộ sưu tập</span>
        </button>
        <span class="tooltip" data-i18n="sp.api.collection.description">Xem, tải lên hoặc xóa các hình ảnh/video đã lưu
            trong bộ sưu tập local.</span>
    </div>
</template>
